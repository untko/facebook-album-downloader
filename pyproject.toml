[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "facebook-album-downloader"
version = "2.0.0"
description = "Playwright-based Facebook album and multi-photo post downloader"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "playwright>=1.40.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0.0"]

[project.scripts]
facebook-album-downloader = "facebook_album_downloader.cli:main"

[tool.setuptools.packages.find]
include = ["facebook_album_downloader*"]
